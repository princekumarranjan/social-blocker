<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 320px;
            margin: 0;
            padding: 16px;
            font: 14px system-ui, sans-serif;
            color: #14173a
        }

        h1 {
            margin: 0 0 10px;
            font-size: 20px
        }

        h2 {
            font-size: 13px;
            margin: 14px 0 6px;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #4d5180
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0;
            gap: 8px
        }

        input {
            width: 90px;
            padding: 6px;
            border: 2px solid #d3d6f7;
            border-radius: 8px
        }

        input.w {
            width: 100%
        }

        button {
            margin-top: 14px;
            width: 100%;
            padding: 10px;
            border: 0;
            border-radius: 999px;
            background: #2331ff;
            color: #fff;
            font-weight: 600;
            cursor: pointer
        }

        #ok {
            height: 18px;
            color: #118a5e;
            margin-top: 6px;
            font-weight: 600
        }
    </style>
</head>

<body>
    <h1>Wapas</h1>
    <h2>Today</h2>
    <div id="today"></div>
    <h2>Limits</h2>
    <div class="row">Reels before a nudge<input id="reelLimit" type="number" min="3" max="50"></div>
    <div class="row">Instagram (min/day)<input id="instagram" type="number" min="0" max="600"></div>
    <div class="row">YouTube (min/day)<input id="youtube" type="number" min="0" max="600"></div>
    <div class="row">Snapchat (min/day)<input id="snapchat" type="number" min="0" max="600"></div>
    <div class="row">Other (min/day)<input id="other" type="number" min="0" max="600"></div>
    <h2>What should you be doing?</h2><input class="w" id="task" maxlength="80" placeholder="e.g. Maths homework">
    <button id="save">Save</button>
    <div id="ok"></div>
    <script src="popup.js"></script>
</body>

</html>
